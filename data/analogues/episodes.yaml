# Historical analogue library. Descriptions are the author's own factual one-line
# summaries of well-documented public events. Every NUMBER used by the engine is
# computed from market data by scripts/build_analogues.py - none is typed here.
# date  = first trading day on which markets could react (event day D)
# self  = tickers of the entity directly hit      (role SELF)
# group = tickers of its promoter/corporate group (role GROUP)
# peers = tickers of comparable firms             (role PEER)
