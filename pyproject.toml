[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tremor"
version = "1.0.0"
description = "Event-to-exposure risk engine: turns news and social text into book-specific loss ranges."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lakshya Manchanda" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
